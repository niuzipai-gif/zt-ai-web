services:
  - type: web
    name: zt-ai-gateway
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false
      - key: DEMO_FALLBACK
        value: "false"
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_TEXT_MODEL
        value: MiniMax-M3
      - key: MINIMAX_BASE_URL
        value: https://api.minimaxi.com/v1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_TEXT_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_BASE_URL
        value: https://api.firecrawl.dev/v2
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: TINEYE_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_SALT
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DATA_RETENTION_DAYS
        value: "90"
      - key: DATABASE_URL
        sync: false
      - key: ZT_AI_DATA_PATH
        value: data/zt-ai.json
      - key: MMX_ENABLED
        value: "true"
      - key: MMX_API_KEY
        sync: false
      - key: MMX_BASE_URL
        value: https://api.minimaxi.com/v1
      - key: MMX_IMAGE_MODEL
        value: image-01
      - key: MMX_VIDEO_MODEL
        value: MiniMax-Hailuo-2.3
      - key: VOICE_MODE_ENABLED
        value: "true"
      - key: MINIMAX_VOICE_ID
        value: CaiZhouTingZh20260827
      - key: MINIMAX_VOICE_ID_ZH
        value: CaiZhouTingZh20260827
      - key: MINIMAX_VOICE_ID_EN
        value: CaiZhouTingEn20260827
      - key: MINIMAX_VOICE_ID_JA
        value: CaiZhouTingJa20260827
      - key: MINIMAX_TTS_MODEL
        value: speech-2.8-hd
      - key: MINIMAX_TTS_SPEED
        value: "1"
      - key: ASR_PROVIDER
        value: browser
      - key: VOICE_BROWSER_ASR
        value: "true"
