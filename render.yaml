services:
  - type: web
    name: zt-ai-gateway
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false
      - key: DEMO_FALLBACK
        value: "false"
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_TEXT_MODEL
        value: MiniMax-M3
      - key: MINIMAX_BASE_URL
        value: https://api.minimaxi.com/v1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_TEXT_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_BASE_URL
        value: https://api.firecrawl.dev/v2
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_BASE_URL
        value: https://api.tavily.com
      - key: ZHIHU_API_KEY
        sync: false
      - key: ZHIHU_BASE_URL
        value: https://developer.zhihu.com
      - key: ZHIHU_SEARCH_PATH
        value: /api/v1/content/zhihu_search
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_BASE_URL
        value: https://api.search.tinyfish.ai
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: TINEYE_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_SALT
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DATA_RETENTION_DAYS
        value: "90"
      - key: DATABASE_URL
        sync: false
      - key: ZT_AI_DATA_PATH
        value: data/zt-ai.json
      - key: MMX_ENABLED
        value: "true"
      - key: MMX_API_KEY
        sync: false
      - key: MMX_BASE_URL
        value: https://api.minimaxi.com/v1
      - key: MMX_IMAGE_MODEL
        value: image-01
      - key: MMX_VIDEO_MODEL
        value: MiniMax-Hailuo-2.3
      - key: VOICE_MODE_ENABLED
        value: "true"
      - key: MINIMAX_VOICE_ID
        value: CaiZhouTingZhClean20260828
      - key: MINIMAX_VOICE_ID_ZH
        value: CaiZhouTingZhClean20260828
      - key: MINIMAX_VOICE_ID_EN
        value: CaiZhouTingEnClean20260828
      - key: MINIMAX_VOICE_ID_JA
        value: CaiZhoutingJaClean20260828
      - key: MINIMAX_TTS_MODEL
        value: speech-2.8-hd
      - key: MINIMAX_TTS_SPEED
        value: "1"
      - key: MINIMAX_TTS_MODEL_EN
        value: speech-2.8-hd
      - key: MINIMAX_TTS_MODEL_JA
        value: speech-2.8-hd
      - key: MINIMAX_TTS_SPEED_EN
        value: "0.90"
      - key: MINIMAX_TTS_SPEED_JA
        value: "0.88"
      - key: MINIMAX_TTS_EMOTION_EN
        value: calm
      - key: MINIMAX_TTS_EMOTION_JA
        value: calm
      - key: MINIMAX_TTS_PRONUNCIATION_EN_JSON
        value: '{"ZT.AI":"zee tee eye","AI":"A I","API":"A P I","FDE":"eff dee ee","ASIN":"A S I N","SKU":"S K U","蔡宙廷":"Zhouting Cai"}'
      - key: MINIMAX_TTS_PRONUNCIATION_JA_JSON
        value: '{"蔡宙廷":"さい・ちょうてい","ZT.AI":"ゼットエーアイ","AI":"エーアイ","API":"エーピーアイ","FDE":"エフディーイー","Amazon":"アマゾン","MiniMax":"ミニマックス","LinkFox":"リンクフォックス","GitHub":"ギットハブ"}'
      - key: ASR_PROVIDER
        value: browser
      - key: VOICE_BROWSER_ASR
        value: "true"
