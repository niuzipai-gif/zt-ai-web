appId: ai.zt.desktopagent
productName: ZT.buddy
icon: desktop-app/icon.ico
directories:
  output: release
  buildResources: desktop-app/resources
extraMetadata:
  main: desktop-app/main.mjs
files:
  - desktop-app/**/*
  - agent-desktop/public/**/*
  - agent-desktop/src/**/*
  - server/src/**/*
  - server/package.json
  - node_modules/@openai/codex/**/*
  - node_modules/@openai/codex-win32-x64/**/*
  - node_modules/cloakbrowser/**/*
  - node_modules/playwright-core/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/mammoth/mammoth.browser.js
  - node_modules/xlsx/**/*
  - desktop-app/THIRD_PARTY_NOTICES.txt
  - package.json
asar: true
asarUnpack:
  - agent-desktop/**
  - node_modules/@openai/codex/**
  - node_modules/@openai/codex-win32-x64/**
  - node_modules/pdfjs-dist/**
  - node_modules/mammoth/**
  - node_modules/xlsx/**
  - node_modules/cloakbrowser/**
  - node_modules/playwright-core/**
extraResources:
  - from: desktop-app/resources/officecli
    to: officecli
    filter:
      - officecli.exe
win:
  target:
    - nsis
    - portable
  artifactName: ZT.buddy-Desktop-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ZT.buddy
portable:
  artifactName: ZT.buddy-Desktop-${version}-${arch}-portable.${ext}
