appId: ai.zt.desktopagent
productName: ZT.buddy
icon: desktop-app/icon.ico
directories:
  output: release
  buildResources: desktop-app/resources
extraMetadata:
  main: desktop-app/main.mjs
files:
  - desktop-app/**/*
  - agent-desktop/public/**/*
  - agent-desktop/src/**/*
  - agent-desktop/mimocode.lock.json
  - server/src/**/*
  - server/package.json
  - node_modules/@mimo-ai/cli/**/*
  - node_modules/@mimo-ai/mimocode-windows-x64/**/*
  - node_modules/cloakbrowser/**/*
  - node_modules/playwright-core/**/*
  - desktop-app/THIRD_PARTY_NOTICES.txt
  - package.json
asar: true
asarUnpack:
  - agent-desktop/**
  - node_modules/@mimo-ai/cli/**
  - node_modules/@mimo-ai/mimocode-windows-x64/**
win:
  target:
    - nsis
    - portable
  artifactName: ZT.buddy-Desktop-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ZT.buddy
portable:
  artifactName: ZT.buddy-Desktop-${version}-${arch}-portable.${ext}
