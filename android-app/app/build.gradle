plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ztai.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ztai.mobile'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '0.2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}
